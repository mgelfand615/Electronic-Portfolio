<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="Cartoon illustration of a classroom desk with a laptop, stacked books, alphabet and number blocks, a cup of pencils, a potted plant, a lightbulb, and a paper airplane.">
  <title>Learning with technology</title>

  <!-- Background -->
  <rect width="800" height="600" fill="#f5efe4"/>

  <!-- Soft halo centred on the composition, tying every element together -->
  <circle cx="406" cy="338" r="248" fill="#e3ece5"/>
  <circle cx="406" cy="338" r="248" fill="none" stroke="#cfe0d6" stroke-width="3"/>

  <!-- Sparkles, kept in the upper band around the floating elements -->
  <g fill="#7fa793">
    <circle cx="238" cy="214" r="6"/>
    <circle cx="300" cy="272" r="4"/>
    <circle cx="188" cy="300" r="5"/>
    <circle cx="588" cy="268" r="5"/>
    <circle cx="640" cy="330" r="4"/>
  </g>
  <g stroke="#c2683f" stroke-width="4" stroke-linecap="round">
    <path d="M296 196v-18M288 187h18"/>
    <path d="M566 214v-16M558 206h16"/>
  </g>

  <!-- Lightbulb: the idea, centred directly above the laptop -->
  <g transform="translate(446 232)">
    <g stroke="#d9a15f" stroke-width="5" stroke-linecap="round">
      <path d="M-50 -22h-20M50 -22h20M-36 -56l-14-14M36 -56l14-14M0 -72v-20"/>
    </g>
    <path d="M0 -52a36 36 0 0 1 22 64v10a10 10 0 0 1-10 10h-24a10 10 0 0 1-10-10v-10A36 36 0 0 1 0 -52z"
          fill="#f2c98a" stroke="#b8863f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-13 30h26M-11 40h22" stroke="#b8863f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Paper airplane, flying out of the scene -->
  <g transform="translate(652 178) rotate(-14)">
    <path d="M-44 -17 44 -32 6 32z" fill="#fbf8f3" stroke="#3f6b57" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-44 -17 6 32 12 -6z" fill="#cfe0d6" stroke="#3f6b57" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-88 5q26 -13 44 -22" fill="none" stroke="#7fa793" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="10 12"/>
  </g>

  <!-- ── Objects on the desk. Every bottom edge lands on y=450. ─────────── -->

  <!-- Stacked books (110–230) -->
  <g stroke-width="4" stroke-linejoin="round">
    <rect x="114" y="378" width="112" height="22" rx="5" fill="#d9a15f" stroke="#b8863f"/>
    <rect x="126" y="378" width="11" height="22" fill="#b8863f"/>
    <rect x="118" y="400" width="106" height="24" rx="5" fill="#3f6b57" stroke="#2f5343"/>
    <rect x="130" y="400" width="11" height="24" fill="#2f5343"/>
    <rect x="110" y="424" width="120" height="26" rx="5" fill="#c2683f" stroke="#8f4526"/>
    <rect x="122" y="424" width="11" height="26" fill="#8f4526"/>
  </g>

  <!-- Alphabet + number blocks (244–338) -->
  <g stroke-width="4">
    <rect x="244" y="406" width="44" height="44" rx="8" fill="#fbf8f3" stroke="#3f6b57"/>
    <text x="266" y="429" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700"
          fill="#3f6b57" text-anchor="middle" dominant-baseline="central">A</text>
    <rect x="294" y="406" width="44" height="44" rx="8" fill="#fbf8f3" stroke="#c2683f"/>
    <text x="316" y="429" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700"
          fill="#c2683f" text-anchor="middle" dominant-baseline="central">1</text>
  </g>

  <!-- Laptop (base 344–548, flat on the desk) -->
  <g>
    <rect x="356" y="300" width="180" height="132" rx="12" fill="#3f6b57" stroke="#2f5343" stroke-width="5"/>
    <rect x="369" y="313" width="154" height="106" rx="6" fill="#fbf8f3"/>
    <circle cx="402" cy="347" r="17" fill="#cfe0d6" stroke="#3f6b57" stroke-width="4"/>
    <rect x="428" y="330" width="34" height="34" rx="6" fill="#f2c98a" stroke="#b8863f" stroke-width="4"/>
    <path d="M490 330 512 364H468z" fill="#dd9068" stroke="#8f4526" stroke-width="4" stroke-linejoin="round"/>
    <rect x="384" y="380" width="124" height="8" rx="4" fill="#e3ece5"/>
    <rect x="384" y="395" width="80" height="8" rx="4" fill="#e3ece5"/>
    <rect x="344" y="432" width="204" height="18" rx="9" fill="#cfe0d6" stroke="#2f5343" stroke-width="5"/>
    <rect x="428" y="437" width="36" height="6" rx="3" fill="#7fa793"/>
  </g>

  <!-- Cup of pencils (559–609) -->
  <g>
    <g stroke-width="4" stroke-linejoin="round">
      <g transform="rotate(-9 575 410)">
        <rect x="569" y="354" width="12" height="56" fill="#dd9068" stroke="#8f4526"/>
        <path d="M569 354 575 339 581 354z" fill="#f2c98a" stroke="#8f4526"/>
      </g>
      <g transform="rotate(7 593 410)">
        <rect x="587" y="364" width="12" height="46" fill="#7fa793" stroke="#2f5343"/>
        <path d="M587 364 593 349 599 364z" fill="#cfe0d6" stroke="#2f5343"/>
      </g>
    </g>
    <path d="M562 406h44l-4 38a6 6 0 0 1-6 6h-24a6 6 0 0 1-6-6z"
          fill="#3f6b57" stroke="#2f5343" stroke-width="4" stroke-linejoin="round"/>
    <rect x="559" y="400" width="50" height="10" rx="5" fill="#2f5343"/>
  </g>

  <!-- Potted plant (617–703) -->
  <g>
    <path d="M660 364Q628 358 618 328Q652 324 660 360Z" fill="#7fa793" stroke="#2f5343"
          stroke-width="4" stroke-linejoin="round"/>
    <path d="M660 354Q696 346 704 314Q666 312 660 350Z" fill="#3f6b57" stroke="#2f5343"
          stroke-width="4" stroke-linejoin="round"/>
    <path d="M660 404V352" stroke="#2f5343" stroke-width="4" stroke-linecap="round"/>
    <path d="M622 408h76l-7 36a6 6 0 0 1-6 6h-50a6 6 0 0 1-6-6z"
          fill="#c2683f" stroke="#8f4526" stroke-width="4" stroke-linejoin="round"/>
    <rect x="617" y="400" width="86" height="11" rx="5.5" fill="#8f4526"/>
  </g>

  <!-- ── Desk ───────────────────────────────────────────────────────────── -->
  <rect x="60" y="450" width="680" height="16" rx="8" fill="#cbbda6"/>
  <rect x="60" y="450" width="680" height="6" rx="3" fill="#ddd2bd"/>
  <rect x="142" y="466" width="22" height="64" rx="8" fill="#cbbda6"/>
  <rect x="636" y="466" width="22" height="64" rx="8" fill="#cbbda6"/>
</svg>
